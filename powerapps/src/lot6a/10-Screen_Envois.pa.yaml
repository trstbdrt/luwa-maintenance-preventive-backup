Screens:
  Screen_Envois:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      OnVisible: |-
        =UpdateContext({locVoirEnvoyees: false});
        Select(btnEnvTraiter)
    Children:
      - btnEnvRetour:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="←  Accueil"
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(15, 108, 189, 1)
            HoverFill: =RGBA(230, 241, 251, 1)
            HoverColor: =RGBA(15, 108, 189, 1)
            BorderColor: =RGBA(15, 108, 189, 1)
            BorderThickness: =1
            X: =40
            Y: =24
            Width: =180
            Height: =50
            OnSelect: =Navigate(Screen_Home, ScreenTransition.None)
      - lblEnvTitre:
          Control: Label@2.5.1
          Properties:
            Text: ="Envois"
            Size: =26
            FontWeight: =FontWeight.Semibold
            X: =240
            Y: =20
            Width: =600
            Height: =56
      - lblEnvReseau:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =If(Connection.Connected, "📶 Réseau disponible : envoi automatique", "✈ Hors connexion : envoi dès le retour du réseau")
            Color: =If(Connection.Connected, RGBA(16, 124, 16, 1), RGBA(176, 96, 0, 1))
            FontWeight: =FontWeight.Semibold
            X: =40
            Y: =92
            Width: =900
            Height: =44
      - btnEnvEnvoyer:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =If(gblEnvoiEnCours, "Envoi en cours…", "Envoyer maintenant")
            DisplayMode: =If(Connection.Connected && !gblEnvoiEnCours && CountRows(Filter(colFile, Etat <> "ENVOYEE")) > 0, DisplayMode.Edit, DisplayMode.Disabled)
            X: =1066
            Y: =88
            Width: =260
            Height: =50
            OnSelect: =Select(btnEnvTraiter)
      - lblEnvVide:
          Control: Label@2.5.1
          Properties:
            Visible: =IsEmpty(Filter(colFile, Etat <> "ENVOYEE"))
            Text: |-
              ="✓ Rien à envoyer : tout est dans SharePoint."
            Color: =RGBA(16, 124, 16, 1)
            Size: =16
            X: =40
            Y: =150
            Width: =1286
            Height: =50
      - galEnvFile:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: =Sort(Filter(colFile, Etat <> "ENVOYEE"), DateAjout)
            Visible: =!IsEmpty(Filter(colFile, Etat <> "ENVOYEE"))
            X: =40
            Y: =150
            Width: =1286
            Height: =Min(5, CountRows(Filter(colFile, Etat <> "ENVOYEE"))) * 76
            TemplateSize: =76
            TemplatePadding: =0
            OnSelect: |-
              =// Seul un brouillon (non soumis) peut être rouvert pour être terminé
              If(
                  !ThisItem.Soumise && ThisItem.Etat <> "ENVOI" && !gblEnvoiEnCours,
                  // Brouillon gardé sur la tablette : ses données locales deviennent la copie de travail (et quittent la file)
                  Set(gblInspectionGUID, ThisItem.InspectionGUID);
                  Set(gblInspectionID, ThisItem.InspectionID);
                  Set(gblTypeInspection, ThisItem.TypeInspection);
                  Set(gblNomOuvrage, ThisItem.NomOuvrage);
                  Set(gblInspection, IfError(LookUp(INSPECTIONS, InspectionGUID = ThisItem.InspectionGUID), Blank()));
                  ClearCollect(colReponsesLocales, Filter(colReponses, false));
                  IfError(LoadData(colReponsesLocales, "luwa_rep_" & ThisItem.InspectionGUID, true); true, false);
                  ClearCollect(colPhotosLocales, Filter(colPhotos, false));
                  IfError(LoadData(colPhotosLocales, "luwa_pho_" & ThisItem.InspectionGUID, true); true, false);
                  RemoveIf(colFile, InspectionGUID = gblInspectionGUID);
                  IfError(SaveData(colFile, "luwa_file"); true, false);
                  Set(gblRepriseLocale, true);
                  Navigate(Screen_Inspection, ScreenTransition.None)
              )
          Children:
            - btnEnvCarte:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  X: =0
                  Y: =4
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight - 8
                  Fill: =RGBA(255, 255, 255, 1)
                  HoverFill: =If(ThisItem.Soumise, RGBA(255, 255, 255, 1), RGBA(230, 241, 251, 1))
                  PressedFill: =If(ThisItem.Soumise, RGBA(255, 255, 255, 1), RGBA(205, 226, 247, 1))
                  BorderColor: =RGBA(200, 205, 212, 1)
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Select(Parent)
            - lblEnvLigne1:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.NomOuvrage
                  Size: =16
                  FontWeight: =FontWeight.Semibold
                  X: =20
                  Y: =8
                  Width: =Parent.TemplateWidth * 0.5
                  Height: =32
            - lblEnvLigne2:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: |-
                    =If(ThisItem.TypeInspection = "LUMINAIRE", "Luminaire", "Poteau")
                    & "  ·  " & If(ThisItem.Soumise, "soumise", "gardée") & " à " & Text(ThisItem.DateAjout, "hh:mm")
                    & "  ·  " & ThisItem.NbReponses & " réponse(s), " & ThisItem.NbPhotos & " photo(s)"
                  Size: =12
                  Color: =RGBA(96, 94, 92, 1)
                  X: =20
                  Y: =40
                  Width: =Parent.TemplateWidth * 0.6
                  Height: =28
            - lblEnvEtat:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: |-
                    =Switch(
                        ThisItem.Etat,
                        "BROUILLON", "Brouillon : à terminer  ›",
                        "A_ENVOYER", "À envoyer",
                        "ENVOI", "Envoi en cours… " & ThisItem.PhotosEnvoyees & "/" & ThisItem.NbPhotos & " photo(s)",
                        "ERREUR", "Erreur : nouvel essai automatique",
                        ThisItem.Etat
                    )
                  Color: =Switch(ThisItem.Etat, "BROUILLON", RGBA(96, 94, 92, 1), "A_ENVOYER", RGBA(176, 96, 0, 1), "ENVOI", RGBA(15, 108, 189, 1), "ERREUR", RGBA(196, 43, 28, 1), RGBA(96, 94, 92, 1))
                  FontWeight: =FontWeight.Semibold
                  Align: =Align.Right
                  X: =Parent.TemplateWidth * 0.5
                  Y: =20
                  Width: =Parent.TemplateWidth * 0.5 - 70
                  Height: =36
            - icoEnvInfo:
                Control: Classic/Icon@2.5.0
                Properties:
                  Visible: =ThisItem.Etat = "ERREUR"
                  Icon: =Icon.Information
                  Color: =RGBA(196, 43, 28, 1)
                  X: =Parent.TemplateWidth - 56
                  Y: =20
                  Width: =36
                  Height: =36
                  OnSelect: |-
                    =Notify(ThisItem.Message & " (essai " & ThisItem.Essais & ")", NotificationType.Error)
      - lblEnvCompteur:
          Control: Label@2.5.1
          Properties:
            Text: =CountRows(Filter(colFile, Etat <> "ENVOYEE")) & " / 20 inspections sur la tablette"
            Size: =12
            Color: =RGBA(96, 94, 92, 1)
            X: =40
            Y: =540
            Width: =600
            Height: =32
      - btnEnvVoirEnvoyees:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =!IsEmpty(Filter(colFile, Etat = "ENVOYEE"))
            Text: ="Envoyées aujourd'hui (" & CountRows(Filter(colFile, Etat = "ENVOYEE")) & ")  " & If(locVoirEnvoyees, "⌃", "⌄")
            Size: =13
            Align: =Align.Left
            Fill: =RGBA(0, 0, 0, 0)
            Color: =RGBA(15, 108, 189, 1)
            HoverFill: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            X: =40
            Y: =580
            Width: =400
            Height: =36
            OnSelect: |-
              =UpdateContext({locVoirEnvoyees: !locVoirEnvoyees})
      - galEnvEnvoyees:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Visible: =locVoirEnvoyees
            Items: =Sort(Filter(colFile, Etat = "ENVOYEE"), DateEnvoi, SortOrder.Descending)
            X: =40
            Y: =620
            Width: =1286
            Height: =130
            TemplateSize: =32
          Children:
            - lblEnvEnvoyee:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    ="✓  " & ThisItem.NomOuvrage & "  ·  " & If(ThisItem.TypeInspection = "LUMINAIRE", "Luminaire", "Poteau")
                    & "  ·  " & If(ThisItem.Soumise, "soumise", "brouillon") & ", envoyée à " & Text(ThisItem.DateEnvoi, "hh:mm")
                  Size: =12
                  Color: =RGBA(16, 124, 16, 1)
                  X: =8
                  Y: =2
                  Width: =Parent.TemplateWidth - 16
                  Height: =28
      - btnEnvTraiter:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =false
            Text: ="(technique) envoi"
            X: =0
            Y: =0
            Width: =10
            Height: =10
            OnSelect: |-
              =// Envoi d'UNE inspection de la file (colFile) vers SharePoint ; relancé par le minuteur tant qu'il reste des envois
              If(
                  Connection.Connected && !gblEnvoiEnCours && !IsEmpty(Filter(colFile, Etat <> "ENVOYEE")),
                  Set(gblEnvoiEnCours, true);
                  Set(gblEnvErreur, "");
                  Set(gblEnvCourant, First(Sort(Filter(colFile, Etat <> "ENVOYEE"), DateAjout)));
                  Patch(colFile, LookUp(colFile, InspectionGUID = gblEnvCourant.InspectionGUID), {Etat: "ENVOI", Message: ""});
                  // Données de l'inspection, gardées sur la tablette (une entrée par inspection)
                  ClearCollect(colEnvRep, Filter(colReponses, false));
                  IfError(LoadData(colEnvRep, "luwa_rep_" & gblEnvCourant.InspectionGUID, true); true, false);
                  ClearCollect(colEnvPho, Filter(colPhotos, false));
                  IfError(LoadData(colEnvPho, "luwa_pho_" & gblEnvCourant.InspectionGUID, true); true, false);
                  // 1. Fiche d'inspection (créée si elle n'existe pas encore dans SharePoint : inspection commencée hors ligne)
                  IfError(
                      If(
                          IsBlank(LookUp(INSPECTIONS, InspectionGUID = gblEnvCourant.InspectionGUID)),
                          Patch(
                              INSPECTIONS,
                              Defaults(INSPECTIONS),
                              {
                                  Title: gblEnvCourant.InspectionID,
                                  InspectionID: gblEnvCourant.InspectionID,
                                  InspectionGUID: gblEnvCourant.InspectionGUID,
                                  TypeInspection: {Value: gblEnvCourant.TypeInspection},
                                  NomOuvrage: gblEnvCourant.NomOuvrage,
                                  CleOuvrage: Substitute(Upper(gblEnvCourant.NomOuvrage), " ", ""),
                                  Inspecteur: nfPersonneCourante,
                                  DateCreation: gblEnvCourant.DateCreation,
                                  DateDerniereModification: Now(),
                                  StatutInspection: {Value: "BROUILLON"},
                                  StatutTraitement: {Value: "NON_ANALYSE"}
                              }
                          )
                      );
                      true,
                      Set(gblEnvErreur, "Fiche : " & FirstError.Message);
                      false
                  );
                  // 2. Photos (une par une ; une photo en échec reste à envoyer)
                  If(
                      gblEnvErreur = "",
                      ClearCollect(colEnvPhoAEnvoyer, Filter(colEnvPho, EtatSynchro = "EN_ATTENTE"));
                      ForAll(
                          colEnvPhoAEnvoyer As wP,
                          IfError(
                              LUWA_EnvoyerPhoto.Run(
                                  gblEnvCourant.InspectionGUID,
                                  wP.QuestionCode,
                                  gblEnvCourant.NomOuvrage,
                                  wP.NomFichier,
                                  Text(DateAdd(wP.DatePhoto, TimeZoneOffset(wP.DatePhoto), TimeUnit.Minutes), "yyyy-mm-ddThh:mm:ssZ"),
                                  "COMPRESSEE",
                                  wP.Source,
                                  User().Email
                              );
                              Patch(colEnvPho, LookUp(colEnvPho, PhotoLocaleID = wP.PhotoLocaleID), {EtatSynchro: "ENVOYEE"});
                              true,
                              false
                          )
                      );
                      IfError(SaveData(colEnvPho, "luwa_pho_" & gblEnvCourant.InspectionGUID); true, false);
                      Patch(
                          colFile,
                          LookUp(colFile, InspectionGUID = gblEnvCourant.InspectionGUID),
                          {PhotosEnvoyees: CountRows(Filter(colEnvPho, EtatSynchro = "ENVOYEE"))}
                      );
                      If(
                          !IsEmpty(Filter(colEnvPho, EtatSynchro = "EN_ATTENTE")),
                          Set(gblEnvErreur, CountRows(Filter(colEnvPho, EtatSynchro = "EN_ATTENTE")) & " photo(s) non envoyée(s)")
                      )
                  );
                  // 3. Réponses : créations (sauf celles déjà présentes après un envoi interrompu) puis modifications
                  If(
                      gblEnvErreur = "",
                      IfError(
                          ClearCollect(colEnvDejaLa, Filter(REPONSES, InspectionGUID = gblEnvCourant.InspectionGUID));
                          If(
                              !IsEmpty(Filter(colEnvRep, EtatSynchro = "NOUVELLE" && !(ReponseID in colEnvDejaLa.ReponseID))),
                              Patch(
                                  REPONSES,
                                  ForAll(
                                      Filter(colEnvRep, EtatSynchro = "NOUVELLE" && !(ReponseID in colEnvDejaLa.ReponseID)) As wR,
                                      {
                                          Title: wR.ReponseID,
                                          ReponseID: wR.ReponseID,
                                          InspectionGUID: gblEnvCourant.InspectionGUID,
                                          QuestionCode: wR.QuestionCode,
                                          Valeur: wR.Valeur,
                                          ValeurNumerique: wR.ValeurNumerique,
                                          Commentaire: wR.Commentaire,
                                          DateEncodage: Now(),
                                          UtilisateurEncodage: nfPersonneCourante
                                      }
                                  )
                              )
                          );
                          If(
                              !IsEmpty(Filter(colEnvRep, EtatSynchro = "MODIFIEE" && ReponseID in colEnvDejaLa.ReponseID)),
                              Patch(
                                  REPONSES,
                                  ForAll(
                                      Filter(colEnvRep, EtatSynchro = "MODIFIEE" && ReponseID in colEnvDejaLa.ReponseID) As wR,
                                      {
                                          ID: LookUp(colEnvDejaLa, ReponseID = wR.ReponseID).ID,
                                          Valeur: wR.Valeur,
                                          ValeurNumerique: wR.ValeurNumerique,
                                          Commentaire: wR.Commentaire,
                                          DateEncodage: Now()
                                      }
                                  )
                              )
                          );
                          UpdateIf(colEnvRep, EtatSynchro <> "SYNCHRONISEE", {EtatSynchro: "SYNCHRONISEE"});
                          IfError(SaveData(colEnvRep, "luwa_rep_" & gblEnvCourant.InspectionGUID); true, false);
                          true,
                          Set(gblEnvErreur, "Réponses : " & FirstError.Message);
                          false
                      )
                  );
                  // 4. Statut : soumission (TERMINE, déclenche le rangement PAU-07) ou brouillon (EN_COURS)
                  If(
                      gblEnvErreur = "",
                      IfError(
                          Patch(
                              INSPECTIONS,
                              LookUp(INSPECTIONS, InspectionGUID = gblEnvCourant.InspectionGUID),
                              {
                                  StatutInspection: {Value: If(gblEnvCourant.Soumise, "TERMINE", "EN_COURS")},
                                  DateSoumission: If(gblEnvCourant.Soumise, gblEnvCourant.DateSoumission, Blank()),
                                  DateDerniereModification: Now(),
                                  RapportHTML: If(gblEnvCourant.Soumise, gblEnvCourant.RapportHTML, Blank()),
                                  RapportCSV: If(gblEnvCourant.Soumise, gblEnvCourant.RapportCSV, Blank())
                              }
                          );
                          true,
                          Set(gblEnvErreur, "Statut : " & FirstError.Message);
                          false
                      )
                  );
                  // 5. Résultat
                  If(
                      gblEnvErreur = "",
                      Clear(colEnvRep);
                      Clear(colEnvPho);
                      IfError(SaveData(colEnvRep, "luwa_rep_" & gblEnvCourant.InspectionGUID); true, false);
                      IfError(SaveData(colEnvPho, "luwa_pho_" & gblEnvCourant.InspectionGUID); true, false);
                      Patch(colFile, LookUp(colFile, InspectionGUID = gblEnvCourant.InspectionGUID), {Etat: "ENVOYEE", DateEnvoi: Now(), Message: ""}),
                      Patch(
                          colFile,
                          LookUp(colFile, InspectionGUID = gblEnvCourant.InspectionGUID),
                          {Etat: "ERREUR", Message: gblEnvErreur, Essais: gblEnvCourant.Essais + 1}
                      )
                  );
                  IfError(SaveData(colFile, "luwa_file"); true, false);
                  Set(gblEnvoiEnCours, false)
              )
      - tmrEnvEnvoi:
          Control: Timer
          Properties:
            Duration: =If(Connection.Connected && CountRows(Filter(colFile, Etat <> "ENVOYEE")) > 0, 3000, 20000)
            Repeat: =true
            AutoStart: =true
            Visible: =false
            OnTimerEnd: =Select(btnEnvTraiter)
