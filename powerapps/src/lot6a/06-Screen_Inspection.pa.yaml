Screens:
  Screen_Inspection:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      OnVisible: |-
        =// Inspection (relue si le réseau est disponible)
        Set(gblInspection, IfError(LookUp(INSPECTIONS, InspectionGUID = gblInspectionGUID), gblInspection));
        Set(gblInspectionID, Coalesce(gblInspection.InspectionID, gblInspectionID));
        // Chargement uniquement pour une autre inspection (ou une reprise locale) ;
        // au retour du récapitulatif sur la même inspection, les données en mémoire sont conservées
        If(
            gblRepriseLocale || gblInspectionChargee <> gblInspectionGUID,
            // Catalogue du formulaire et règles d'écran (TD § 4.6, § 5.2)
            ClearCollect(colQuestionsFormulaire, Sort(Filter(colQuestions, Formulaire = gblTypeInspection), OrdreAffichage));
            ClearCollect(
                colReglesFormulaire,
                Filter(
                    colRegles,
                    (Formulaire = gblTypeInspection || Formulaire = "ALL")
                        && ConditionType in ["EQUALS", "GREATER_OR_EQUAL", "LESS_THAN", "VISIBLE"]
                )
            );
            If(
                gblRepriseLocale,
                // Copie locale récupérée (hors connexion)
                ClearCollect(colReponses, colReponsesLocales);
                ClearCollect(colPhotos, colPhotosLocales);
                Set(gblRepriseLocale, false);
                Set(gblEnvoiAuto, true),
                // Relecture SharePoint (rafraîchissement forcé pour éviter un résultat mis en cache)
                Refresh(REPONSES);
                Refresh(PHOTOS_INSPECTIONS);
                ClearCollect(
                    colReponses,
                    ForAll(
                        Filter(REPONSES, InspectionGUID = gblInspectionGUID),
                        {
                            ReponseID: ReponseID,
                            QuestionCode: QuestionCode,
                            Valeur: Valeur,
                            ValeurNumerique: ValeurNumerique,
                            Commentaire: Commentaire,
                            SharePointID: ID,
                            EtatSynchro: "SYNCHRONISEE"
                        }
                    )
                );
                ClearCollect(
                    colPhotos,
                    ForAll(
                        Filter(PHOTOS_INSPECTIONS, InspectionGUID = gblInspectionGUID),
                        {
                            PhotoLocaleID: Text(ID),
                            QuestionCode: QuestionCode,
                            Source: '{Thumbnail}'.Large,
                            NomFichier: "",
                            DatePhoto: DatePhoto,
                            EtatSynchro: "ENVOYEE"
                        }
                    )
                )
            );
            ClearCollect(colEtatQuestions, ForAll(colQuestionsFormulaire, {QuestionCode: QuestionCode, Visible: VisibleParDefaut}));
            Set(gblClesAffichees, "");
            Set(gblInspectionChargee, gblInspectionGUID)
        );
        UpdateContext({locQuestionActive: "", locAfficherPanneauCommentaire: false, locAfficherPanneauPhotos: false, locEnregistrementEnCours: false, locQuitterApresEnregistrement: false, locAllerResume: false, locCamera: 0, locEnvoiPhotosEnCours: false});
        Reset(galInspQuestions);
        Set(gblEvaluationEnCours, false);
        Select(btnInspEvaluer);
        // Récupération depuis l'accueil (« Envoyer maintenant ») : envoi immédiat vers SharePoint si le réseau est là
        If(
            gblEnvoiAuto,
            Set(gblEnvoiAuto, false);
            If(
                Connection.Connected,
                Select(btnInspEnregistrer),
                Notify("Pas de réseau : l'inspection reste sur la tablette. Touchez « Enregistrer » dès que le réseau revient.", NotificationType.Warning)
            )
        )
    Children:
      - lblInspTitre:
          Control: Label@2.5.1
          Properties:
            Text: =gblNomOuvrage
            X: =40
            Y: =10
            Width: =780
            Height: =48
            Size: =26
            FontWeight: =FontWeight.Semibold
      - lblInspType:
          Control: Label@2.5.1
          Properties:
            Text: =If(gblTypeInspection = "LUMINAIRE", "Luminaire", "Poteau")
            Size: =12
            Fill: =RGBA(230, 241, 251, 1)
            Color: =RGBA(15, 108, 189, 1)
            Align: =Align.Center
            X: =40
            Y: =58
            Width: =100
            Height: =24
      - lblInspHorsLigne:
          Control: Label@2.5.1
          Properties:
            Visible: =!Connection.Connected
            Text: |-
              ="⚠ Hors connexion : les modifications restent sur la tablette"
            Size: =12
            Color: =RGBA(176, 96, 0, 1)
            X: =156
            Y: =58
            Width: =620
            Height: =24
      - rectInspProgFond:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(225, 228, 232, 1)
            X: =40
            Y: =90
            Width: =1286
            Height: =6
      - rectInspProgPlein:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =If(gblResteObligatoires + gblResteCommentaires + gblRestePhotos = 0 && !gblSoumissionBloquee, RGBA(16, 124, 16, 1), RGBA(15, 108, 189, 1))
            X: =40
            Y: =90
            Width: |-
              =// Progression : questions à compléter (obligatoires, photos ou commentaire requis) déjà complètes
              1286 * CountRows(Filter(colQuestionsAffichees As q, (q.ObligatoireEff || q.PhotosMin > 0 || q.CommentaireObligatoireEff) && With({wR: LookUp(colReponses, QuestionCode = q.QuestionCode), wN: CountRows(Filter(colPhotos, QuestionCode = q.QuestionCode))}, (!q.ObligatoireEff || q.TypeQuestion = "PHOTO" || !IsBlank(wR.Valeur) || !IsBlank(wR.ValeurNumerique)) && wN >= If(q.TypeQuestion = "PHOTO" && q.ObligatoireEff, Max(1, q.PhotosMin), q.PhotosMin) && (!q.CommentaireObligatoireEff || !IsBlank(wR.Commentaire)))))
                  / Max(1, CountRows(Filter(colQuestionsAffichees As q, (q.ObligatoireEff || q.PhotosMin > 0 || q.CommentaireObligatoireEff))))
            Height: =6
      - btnInspProchaine:
          Control: Classic/Button@2.2.0
          Properties:
            Text: |-
              =If(
                  gblResteObligatoires + gblResteCommentaires + gblRestePhotos = 0 && !gblSoumissionBloquee,
                  "✓  Tout est complété",
                  Concat(
                      Filter(
                          [
                              If(gblResteObligatoires > 0, gblResteObligatoires & If(gblResteObligatoires > 1, " questions", " question")),
                              If(gblRestePhotos > 0, gblRestePhotos & If(gblRestePhotos > 1, " photos", " photo")),
                              If(gblResteCommentaires > 0, gblResteCommentaires & If(gblResteCommentaires > 1, " commentaires", " commentaire")),
                              If(gblSoumissionBloquee, "1 blocage")
                          ],
                          !IsBlank(Value)
                      ),
                      Value,
                      " · "
                  ) & " à compléter  ›"
              )
            DisplayMode: =If(gblResteObligatoires + gblResteCommentaires + gblRestePhotos = 0 && !gblSoumissionBloquee, DisplayMode.Disabled, DisplayMode.Edit)
            Size: =14
            FontWeight: =FontWeight.Semibold
            Fill: =RGBA(255, 244, 222, 1)
            Color: =RGBA(176, 96, 0, 1)
            HoverFill: =RGBA(255, 233, 196, 1)
            HoverColor: =RGBA(176, 96, 0, 1)
            PressedFill: =RGBA(255, 222, 170, 1)
            BorderColor: =RGBA(202, 80, 16, 1)
            BorderThickness: =1
            DisabledFill: =RGBA(223, 246, 221, 1)
            DisabledColor: =RGBA(16, 124, 16, 1)
            DisabledBorderColor: =RGBA(16, 124, 16, 1)
            RadiusTopLeft: =23
            RadiusTopRight: =23
            RadiusBottomLeft: =23
            RadiusBottomRight: =23
            X: =836
            Y: =16
            Width: =490
            Height: =46
            OnSelect: |-
              =// Aller à la prochaine question à compléter (réponse, photo, commentaire ou blocage), surlignée dans la liste
              With(
                  {
                      wCible: First(
                          Sort(
                              Filter(
                                  colEtatComplet As wE,
                                  (
                                      wE.ObligatoireEff && wE.TypeQuestion <> "PHOTO"
                                          && With({wR: LookUp(colReponses, QuestionCode = wE.QuestionCode)}, IsBlank(wR.Valeur) && IsBlank(wR.ValeurNumerique))
                                  )
                                  || (
                                      wE.Visible
                                          && CountRows(Filter(colPhotos, QuestionCode = wE.QuestionCode))
                                              < If(wE.TypeQuestion = "PHOTO" && wE.ObligatoireEff, Max(1, wE.PhotosMin), wE.PhotosMin)
                                  )
                                  || (wE.CommentaireObligatoireEff && IsBlank(LookUp(colReponses, QuestionCode = wE.QuestionCode).Commentaire))
                                  || !IsEmpty(Filter(colReglesEval, Vraie && Action = "BLOQUER_SOUMISSION" && QuestionSource = wE.QuestionCode))
                              ),
                              OrdreAffichage
                          )
                      ).QuestionCode
                  },
                  If(!IsBlank(wCible), Set(gblQuestionCible, wCible); Reset(galInspQuestions))
              )
      - galInspQuestions:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: =colQuestionsAffichees
            X: =40
            Y: =100
            Width: =1286
            Height: =580
            TemplateSize: =90
            TemplatePadding: =0
            Default: =LookUp(colQuestionsAffichees, QuestionCode = gblQuestionCible)
            TemplateFill: =If(ThisItem.QuestionCode = gblQuestionCible, RGBA(255, 244, 222, 1), RGBA(0, 0, 0, 0))
          Children:
            - lblQFait:
                Control: Label@2.5.1
                Properties:
                  Visible: |-
                    =// ✓ : question complète (ou facultative et renseignée)
                    If((ThisItem.ObligatoireEff || ThisItem.PhotosMin > 0 || ThisItem.CommentaireObligatoireEff), With({wR: LookUp(colReponses, QuestionCode = ThisItem.QuestionCode), wN: CountRows(Filter(colPhotos, QuestionCode = ThisItem.QuestionCode))}, (!ThisItem.ObligatoireEff || ThisItem.TypeQuestion = "PHOTO" || !IsBlank(wR.Valeur) || !IsBlank(wR.ValeurNumerique)) && wN >= If(ThisItem.TypeQuestion = "PHOTO" && ThisItem.ObligatoireEff, Max(1, ThisItem.PhotosMin), ThisItem.PhotosMin) && (!ThisItem.CommentaireObligatoireEff || !IsBlank(wR.Commentaire))), With({wR: LookUp(colReponses, QuestionCode = ThisItem.QuestionCode)}, !IsBlank(wR.Valeur) || !IsBlank(wR.ValeurNumerique) || !IsBlank(wR.Commentaire) || !IsEmpty(Filter(colPhotos, QuestionCode = ThisItem.QuestionCode))))
                  Text: ="✓"
                  Size: =18
                  FontWeight: =FontWeight.Bold
                  Color: =RGBA(16, 124, 16, 1)
                  Align: =Align.Center
                  X: =If(IsBlank(ThisItem.QuestionParent), 12, 52)
                  Y: =6
                  Width: =30
                  Height: =28
            - lblQLibelle:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    =ThisItem.Num & ".  " & ThisItem.Libelle & If((ThisItem.ObligatoireEff || ThisItem.PhotosMin > 0 || ThisItem.CommentaireObligatoireEff), "", "   (facultatif)")
                  FontWeight: =FontWeight.Semibold
                  X: =If(IsBlank(ThisItem.QuestionParent), 46, 86)
                  Y: =6
                  Width: =Parent.TemplateWidth * 0.55
                  Height: =28
            - galQOptions:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Horizontal_TwoTextOneImageVariant_ver5.0
                Properties:
                  Visible: =ThisItem.TypeQuestion = "RADIO" || ThisItem.TypeQuestion = "CHECKBOX"
                  Items: |-
                    =// Choix affichés comme boutons : l'état visible vient uniquement de colReponses (ce qui est affiché est enregistré)
                    With(
                        {
                            wCodes: Split(ThisItem.ValeursPossibles, "|"),
                            wLibs: Split(Coalesce(ThisItem.LibellesValeurs, ThisItem.ValeursPossibles), "|"),
                            wQ: ThisItem.QuestionCode,
                            wT: ThisItem.TypeQuestion
                        },
                        ForAll(
                            Sequence(CountRows(wCodes)) As wI,
                            {
                                Code: Index(wCodes, wI.Value).Value,
                                Libelle: If(CountRows(wLibs) >= wI.Value, Index(wLibs, wI.Value).Value, Index(wCodes, wI.Value).Value),
                                QCode: wQ,
                                QType: wT
                            }
                        )
                    )
                  X: =If(IsBlank(ThisItem.QuestionParent), 46, 86)
                  Y: =38
                  Width: =Parent.TemplateWidth - 330
                  Height: =48
                  TemplateSize: =235
                  TemplatePadding: =0
                  ShowScrollbar: =false
                Children:
                  - btnQOption:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: |-
                          =If(LookUp(colReponses, QuestionCode = ThisItem.QCode).Valeur = ThisItem.Code, "✓  ", "") & ThisItem.Libelle
                        Size: =13
                        Fill: =If(LookUp(colReponses, QuestionCode = ThisItem.QCode).Valeur = ThisItem.Code, RGBA(15, 108, 189, 1), RGBA(255, 255, 255, 1))
                        Color: =If(LookUp(colReponses, QuestionCode = ThisItem.QCode).Valeur = ThisItem.Code, RGBA(255, 255, 255, 1), RGBA(15, 108, 189, 1))
                        HoverFill: =If(LookUp(colReponses, QuestionCode = ThisItem.QCode).Valeur = ThisItem.Code, RGBA(12, 90, 160, 1), RGBA(230, 241, 251, 1))
                        PressedFill: =RGBA(205, 226, 247, 1)
                        HoverColor: =If(LookUp(colReponses, QuestionCode = ThisItem.QCode).Valeur = ThisItem.Code, RGBA(255, 255, 255, 1), RGBA(15, 108, 189, 1))
                        BorderColor: =RGBA(15, 108, 189, 1)
                        BorderThickness: =1
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        X: =0
                        Y: =4
                        Width: =Parent.TemplateWidth - 12
                        Height: =40
                        OnSelect: |-
                          =// Choix enregistré immédiatement ; case à cocher : un second appui décoche
                          With(
                              {
                                  wEx: LookUp(colReponses, QuestionCode = ThisItem.QCode),
                                  wVal: If(
                                      ThisItem.QType = "CHECKBOX" && LookUp(colReponses, QuestionCode = ThisItem.QCode).Valeur = ThisItem.Code,
                                      Blank(),
                                      ThisItem.Code
                                  )
                              },
                              If(
                                  IsBlank(wEx),
                                  If(
                                      !IsBlank(wVal),
                                      Collect(colReponses, {ReponseID: Text(GUID()), QuestionCode: ThisItem.QCode, Valeur: wVal, ValeurNumerique: Blank(), Commentaire: Blank(), SharePointID: Blank(), EtatSynchro: "NOUVELLE"})
                                  ),
                                  Coalesce(wEx.Valeur, "") <> Coalesce(wVal, ""),
                                  Patch(colReponses, wEx, {Valeur: wVal, EtatSynchro: If(wEx.EtatSynchro = "NOUVELLE", "NOUVELLE", "MODIFIEE")})
                              )
                          );
                          Set(gblVersionReponses, gblVersionReponses + 1)
            - txtQNumerique:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Visible: =ThisItem.TypeQuestion = "NUMERIQUE"
                  Format: =TextFormat.Number
                  Default: |-
                    =With({wN: LookUp(colReponses, QuestionCode = ThisItem.QuestionCode).ValeurNumerique}, If(IsBlank(wN), "", Text(wN)))
                  HintText: ="Valeur en mm"
                  X: =If(IsBlank(ThisItem.QuestionParent), 46, 86)
                  Y: =38
                  Width: =220
                  Height: =40
                  OnChange: |-
                    =With(
                        {
                            wCode: ThisItem.QuestionCode,
                            wVal: If(IsBlank(Trim(Self.Text)), Blank(), Value(Self.Text)),
                            wEx: LookUp(colReponses, QuestionCode = ThisItem.QuestionCode)
                        },
                        If(
                            IsBlank(wEx.ValeurNumerique) <> IsBlank(wVal) || wEx.ValeurNumerique <> wVal,
                            If(
                                IsBlank(wEx),
                                Collect(colReponses, {ReponseID: Text(GUID()), QuestionCode: wCode, Valeur: Blank(), ValeurNumerique: wVal, Commentaire: Blank(), SharePointID: Blank(), EtatSynchro: "NOUVELLE"}),
                                Patch(colReponses, wEx, {ValeurNumerique: wVal, EtatSynchro: If(wEx.EtatSynchro = "NOUVELLE", "NOUVELLE", "MODIFIEE")})
                            );
                            Set(gblVersionReponses, gblVersionReponses + 1)
                        )
                    )
            - btnQNumeriqueOK:
                Control: Classic/Button@2.2.0
                Properties:
                  Visible: =ThisItem.TypeQuestion = "NUMERIQUE"
                  Text: ="OK"
                  X: =If(IsBlank(ThisItem.QuestionParent), 46, 86) + 232
                  Y: =38
                  Width: =80
                  Height: =40
                  OnSelect: =false
            - lblQCalcul:
                Control: Label@2.5.1
                Properties:
                  Visible: =ThisItem.TypeQuestion = "CALCUL"
                  Text: |-
                    =With(
                        {wN: LookUp(colReponses, QuestionCode = ThisItem.QuestionCode).ValeurNumerique},
                        If(
                            ThisItem.CalculBloque, "⛔ Calcul impossible : l'épaisseur sans corrosion ne peut pas être 0",
                            IsBlank(wN), "Calcul automatique : saisir les deux épaisseurs",
                            "Perte calculée : " & Text(Round(wN, 1)) & " %"
                        )
                    )
                  Color: =If(ThisItem.CalculBloque, RGBA(196, 43, 28, 1), RGBA(32, 31, 30, 1))
                  X: =If(IsBlank(ThisItem.QuestionParent), 46, 86)
                  Y: =38
                  Width: =700
                  Height: =40
            - txtQTexte:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Visible: =ThisItem.TypeQuestion = "TEXTE"
                  Mode: =TextMode.MultiLine
                  Default: =LookUp(colReponses, QuestionCode = ThisItem.QuestionCode).Valeur
                  X: =If(IsBlank(ThisItem.QuestionParent), 46, 86)
                  Y: =38
                  Width: =Parent.TemplateWidth - 140
                  Height: =40
                  OnChange: |-
                    =With(
                        {wCode: ThisItem.QuestionCode, wVal: Self.Text, wEx: LookUp(colReponses, QuestionCode = ThisItem.QuestionCode)},
                        If(
                            Coalesce(wEx.Valeur, "") <> Coalesce(wVal, ""),
                            If(
                                IsBlank(wEx),
                                Collect(colReponses, {ReponseID: Text(GUID()), QuestionCode: wCode, Valeur: wVal, ValeurNumerique: Blank(), Commentaire: Blank(), SharePointID: Blank(), EtatSynchro: "NOUVELLE"}),
                                Patch(colReponses, wEx, {Valeur: wVal, EtatSynchro: If(wEx.EtatSynchro = "NOUVELLE", "NOUVELLE", "MODIFIEE")})
                            );
                            Set(gblVersionReponses, gblVersionReponses + 1)
                        )
                    )
            - lblQPhoto:
                Control: Label@2.5.1
                Properties:
                  Visible: =ThisItem.TypeQuestion = "PHOTO"
                  Text: |-
                    ="Photos : utilisez l'appareil photo 📷 (minimum " & Max(1, ThisItem.PhotosMin) & ")"
                  Italic: =true
                  X: =If(IsBlank(ThisItem.QuestionParent), 46, 86)
                  Y: =38
                  Width: =700
                  Height: =40
            - lblQCommentaire:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    =With(
                        {wC: LookUp(colReponses, QuestionCode = ThisItem.QuestionCode).Commentaire},
                        If(
                            !IsBlank(wC), "💬 " & wC,
                            ThisItem.CommentaireObligatoireEff, "💬 Commentaire obligatoire",
                            ""
                        )
                    )
                  Color: |-
                    =If(
                        ThisItem.CommentaireObligatoireEff && IsBlank(LookUp(colReponses, QuestionCode = ThisItem.QuestionCode).Commentaire),
                        RGBA(196, 43, 28, 1),
                        RGBA(96, 94, 92, 1)
                    )
                  Size: =12
                  Italic: =true
                  X: =Parent.TemplateWidth * 0.55
                  Y: =6
                  Width: =Parent.TemplateWidth * 0.45 - 80
                  Height: =28
                  Align: =Align.Right
            - icoQCommentaire:
                Control: Classic/Icon@2.5.0
                Properties:
                  Visible: =ThisItem.CommentaireAutorise
                  Icon: =Icon.Message
                  Color: |-
                    =If(
                        ThisItem.CommentaireObligatoireEff && IsBlank(LookUp(colReponses, QuestionCode = ThisItem.QuestionCode).Commentaire),
                        RGBA(196, 43, 28, 1),
                        RGBA(15, 108, 189, 1)
                    )
                  X: =Parent.TemplateWidth - 64
                  Y: =38
                  Width: =40
                  Height: =40
                  OnSelect: |-
                    =UpdateContext({locQuestionActive: ThisItem.QuestionCode, locAfficherPanneauCommentaire: true});
                    Reset(txtInspCommentaire)
            - lblQPhotoCompteur:
                Control: Label@2.5.1
                Properties:
                  Visible: =ThisItem.PhotoAutorisee
                  Text: |-
                    =With(
                        {
                            wN: CountRows(Filter(colPhotos, QuestionCode = ThisItem.QuestionCode)),
                            wMin: If(ThisItem.TypeQuestion = "PHOTO" && ThisItem.ObligatoireEff, Max(1, ThisItem.PhotosMin), ThisItem.PhotosMin)
                        },
                        If(wMin = 0, If(wN = 0, "", Text(wN)), wN & "/" & wMin & If(wN >= wMin, " ✅", ""))
                    )
                  Color: |-
                    =With(
                        {
                            wN: CountRows(Filter(colPhotos, QuestionCode = ThisItem.QuestionCode)),
                            wMin: If(ThisItem.TypeQuestion = "PHOTO" && ThisItem.ObligatoireEff, Max(1, ThisItem.PhotosMin), ThisItem.PhotosMin)
                        },
                        If(wN < wMin, RGBA(196, 43, 28, 1), RGBA(16, 124, 16, 1))
                    )
                  Align: =Align.Right
                  X: =Parent.TemplateWidth - 236
                  Y: =38
                  Width: =100
                  Height: =40
            - icoQPhoto:
                Control: Classic/Icon@2.5.0
                Properties:
                  Visible: =ThisItem.PhotoAutorisee
                  Icon: =Icon.Camera
                  Color: |-
                    =If(
                        CountRows(Filter(colPhotos, QuestionCode = ThisItem.QuestionCode))
                            < If(ThisItem.TypeQuestion = "PHOTO" && ThisItem.ObligatoireEff, Max(1, ThisItem.PhotosMin), ThisItem.PhotosMin),
                        RGBA(202, 80, 16, 1),
                        RGBA(15, 108, 189, 1)
                    )
                  X: =Parent.TemplateWidth - 124
                  Y: =38
                  Width: =40
                  Height: =40
                  OnSelect: |-
                    =UpdateContext({locQuestionActive: ThisItem.QuestionCode, locAfficherPanneauPhotos: true})
            - rectQSeparateur:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(225, 228, 232, 1)
                  X: =0
                  Y: =Parent.TemplateHeight - 1
                  Width: =Parent.TemplateWidth
                  Height: =1
      - btnInspEnregistrer:
          Control: Classic/Button@2.2.0
          Properties:
            Text: |-
              =With(
                  {n: CountRows(Filter(colReponses, EtatSynchro <> "SYNCHRONISEE")) + CountRows(Filter(colPhotos, EtatSynchro = "EN_ATTENTE"))},
                  If(locEnregistrementEnCours, "Enregistrement…", n = 0, "Enregistré ✓", "Enregistrer (" & n & ")")
              )
            X: =543
            Y: =690
            Width: =280
            Height: =56
            DisplayMode: =If(locEnregistrementEnCours, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =If(
                  IsEmpty(Filter(colReponses, EtatSynchro <> "SYNCHRONISEE")) && IsEmpty(Filter(colPhotos, EtatSynchro = "EN_ATTENTE")),
                  Notify("Aucune modification à enregistrer.", NotificationType.Information),
                  !Connection.Connected,
                  Notify("Hors connexion : les réponses restent sur l'appareil. Enregistrement automatique au retour du réseau.", NotificationType.Warning),
                  UpdateContext({locEnregistrementEnCours: true});
                  IfError(
                      // 0. Photos en attente : envoi une par une par le flux PAU-06 (LUWA_EnvoyerPhoto) ; une photo en échec reste en attente
                      ClearCollect(colPhotosAEnvoyer, Filter(colPhotos, EtatSynchro = "EN_ATTENTE"));
                      ForAll(
                          colPhotosAEnvoyer As wP,
                          IfError(
                              LUWA_EnvoyerPhoto.Run(
                                  gblInspectionGUID,
                                  wP.QuestionCode,
                                  gblNomOuvrage,
                                  wP.NomFichier,
                                  Text(DateAdd(wP.DatePhoto, TimeZoneOffset(wP.DatePhoto), TimeUnit.Minutes), "yyyy-mm-ddThh:mm:ssZ"),
                                  "COMPRESSEE",
                                  wP.Source,
                                  User().Email
                              );
                              Patch(colPhotos, LookUp(colPhotos, PhotoLocaleID = wP.PhotoLocaleID), {EtatSynchro: "ENVOYEE"});
                              true,
                              false
                          )
                      );
                      // 1. Nouvelles réponses (création groupée)
                      If(
                          !IsEmpty(Filter(colReponses, EtatSynchro = "NOUVELLE")),
                          Patch(
                              REPONSES,
                              ForAll(
                                  Filter(colReponses, EtatSynchro = "NOUVELLE"),
                                  {
                                      Title: ReponseID,
                                      ReponseID: ReponseID,
                                      InspectionGUID: gblInspectionGUID,
                                      QuestionCode: QuestionCode,
                                      Valeur: Valeur,
                                      ValeurNumerique: ValeurNumerique,
                                      Commentaire: Commentaire,
                                      DateEncodage: Now(),
                                      UtilisateurEncodage: nfPersonneCourante
                                  }
                              )
                          )
                      );
                      // 2. Réponses modifiées (mise à jour groupée)
                      If(
                          !IsEmpty(Filter(colReponses, EtatSynchro = "MODIFIEE")),
                          Patch(
                              REPONSES,
                              ForAll(
                                  Filter(colReponses, EtatSynchro = "MODIFIEE"),
                                  {
                                      ID: SharePointID,
                                      Valeur: Valeur,
                                      ValeurNumerique: ValeurNumerique,
                                      Commentaire: Commentaire,
                                      DateEncodage: Now()
                                  }
                              )
                          )
                      );
                      // 3. Inspection : date de modification (DEC-17), BROUILLON → EN_COURS
                      Set(
                          gblInspection,
                          Patch(
                              INSPECTIONS,
                              LookUp(INSPECTIONS, InspectionGUID = gblInspectionGUID),
                              {
                                  DateDerniereModification: Now(),
                                  StatutInspection: {
                                      Value: If(
                                          gblInspection.StatutInspection.Value = "BROUILLON",
                                          "EN_COURS",
                                          gblInspection.StatutInspection.Value
                                      )
                                  }
                              }
                          )
                      );
                      Set(gblInspectionID, gblInspection.InspectionID);
                      // 4. Relecture : identifiants SharePoint, état synchronisé
                      ClearCollect(
                          colReponses,
                          ForAll(
                              Filter(REPONSES, InspectionGUID = gblInspectionGUID),
                              {
                                  ReponseID: ReponseID,
                                  QuestionCode: QuestionCode,
                                  Valeur: Valeur,
                                  ValeurNumerique: ValeurNumerique,
                                  Commentaire: Commentaire,
                                  SharePointID: ID,
                                  EtatSynchro: "SYNCHRONISEE"
                              }
                          )
                      );
                      IfError(SaveData(colReponses, "luwa_reponses"); true, false);
                      IfError(SaveData(colPhotos, "luwa_photos"); true, false);
                      If(
                          !IsEmpty(Filter(colPhotos, EtatSynchro = "EN_ATTENTE")),
                          Notify(
                              CountRows(Filter(colPhotos, EtatSynchro = "EN_ATTENTE")) & " photo(s) non envoyée(s) : elles restent sur l'appareil. Réessayez l'enregistrement.",
                              NotificationType.Warning
                          ),
                          gblResteObligatoires + gblResteCommentaires + gblRestePhotos = 0,
                          Notify("Brouillon enregistré. Tout ce qui est obligatoire est complété.", NotificationType.Success),
                          Notify(
                              "Brouillon enregistré. Reste à compléter : " & gblResteObligatoires & " question(s)"
                              & If(gblRestePhotos > 0, ", " & gblRestePhotos & " photo(s)", "")
                              & If(gblResteCommentaires > 0, ", " & gblResteCommentaires & " commentaire(s)", "") & ".",
                              NotificationType.Warning
                          )
                      );
                      If(
                          IsEmpty(Filter(colReponses, EtatSynchro <> "SYNCHRONISEE")) && IsEmpty(Filter(colPhotos, EtatSynchro = "EN_ATTENTE")),
                          If(locQuitterApresEnregistrement, UpdateContext({locQuitterApresEnregistrement: false}); Navigate(Screen_Home, ScreenTransition.None));
                          If(locAllerResume, UpdateContext({locAllerResume: false}); Navigate(Screen_Resume, ScreenTransition.None))
                      ),
                      Notify(
                          "Enregistrement impossible : " & FirstError.Message & ". Les réponses restent sur l'appareil.",
                          NotificationType.Error
                      )
                  );
                  UpdateContext({locEnregistrementEnCours: false})
              )
      - btnInspAccueil:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="←  Accueil"
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(15, 108, 189, 1)
            HoverFill: =RGBA(230, 241, 251, 1)
            HoverColor: =RGBA(15, 108, 189, 1)
            BorderColor: =RGBA(15, 108, 189, 1)
            BorderThickness: =1
            X: =40
            Y: =690
            Width: =200
            Height: =56
            OnSelect: |-
              =If(
                  IsEmpty(Filter(colReponses, EtatSynchro <> "SYNCHRONISEE")) && IsEmpty(Filter(colPhotos, EtatSynchro = "EN_ATTENTE")),
                  Navigate(Screen_Home, ScreenTransition.None),
                  !Connection.Connected,
                  // Hors connexion : l'inspection est rangée dans la file d'envoi de la tablette, puis on quitte
                  IfError(SaveData(colReponses, "luwa_rep_" & gblInspectionGUID); true, false);
                  IfError(SaveData(colPhotos, "luwa_pho_" & gblInspectionGUID); true, false);
                  RemoveIf(colFile, InspectionGUID = gblInspectionGUID);
                  Collect(
                      colFile,
                      {
                          InspectionGUID: gblInspectionGUID,
                          InspectionID: gblInspectionID,
                          NomOuvrage: gblNomOuvrage,
                          TypeInspection: gblTypeInspection,
                          Soumise: false,
                          Etat: "BROUILLON",
                          DateCreation: Coalesce(gblInspection.DateCreation, Now()),
                          DateAjout: Now(),
                          DateSoumission: Blank(),
                          DateEnvoi: Blank(),
                          RapportHTML: "",
                          RapportCSV: "",
                          NbReponses: CountRows(Filter(colReponses, EtatSynchro <> "SYNCHRONISEE")),
                          NbPhotos: CountRows(Filter(colPhotos, EtatSynchro = "EN_ATTENTE")),
                          PhotosEnvoyees: 0,
                          Essais: 0,
                          Message: ""
                      }
                  );
                  IfError(SaveData(colFile, "luwa_file"); true, false);
                  // la copie de travail est vidée (les données sont dans la file)
                  Clear(colReponses);
                  Clear(colPhotos);
                  IfError(SaveData(colReponses, "luwa_reponses"); true, false);
                  IfError(SaveData(colPhotos, "luwa_photos"); true, false);
                  Set(gblInspectionChargee, "");
                  Notify("Inspection gardée sur la tablette : elle sera envoyée automatiquement au retour du réseau.", NotificationType.Information);
                  Navigate(Screen_Home, ScreenTransition.None),
                  UpdateContext({locQuitterApresEnregistrement: true});
                  Select(btnInspEnregistrer)
              )
      - btnInspResume:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Valider l'inspection  ›"
            Fill: =RGBA(16, 124, 16, 1)
            HoverFill: =RGBA(12, 96, 12, 1)
            X: =1046
            Y: =690
