                Properties:
                  Text: ="OK"
                  X: =30
                  Y: =310
                  Width: =200
                  Height: =56
                  OnSelect: |-
                    =With(
                        {wVal: Trim(txtInspCommentaire.Text), wEx: LookUp(colReponses, QuestionCode = locQuestionActive)},
                        If(
                            Coalesce(wEx.Commentaire, "") <> Coalesce(wVal, ""),
                            If(
                                IsBlank(wEx),
                                Collect(colReponses, {ReponseID: Text(GUID()), QuestionCode: locQuestionActive, Valeur: Blank(), ValeurNumerique: Blank(), Commentaire: wVal, SharePointID: Blank(), EtatSynchro: "NOUVELLE"}),
                                Patch(colReponses, wEx, {Commentaire: wVal, EtatSynchro: If(wEx.EtatSynchro = "NOUVELLE", "NOUVELLE", "MODIFIEE")})
                            );
                            Set(gblVersionReponses, gblVersionReponses + 1)
                        )
                    );
                    UpdateContext({locAfficherPanneauCommentaire: false})
            - btnInspCommentaireAnnuler:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="Annuler"
                  X: =260
                  Y: =310
                  Width: =200
                  Height: =56
                  OnSelect: |-
                    =UpdateContext({locAfficherPanneauCommentaire: false})
      - rectInspVoilePhotos:
          Control: Rectangle@2.3.0
          Properties:
            Visible: =locAfficherPanneauPhotos
            Fill: =RGBA(0, 0, 0, 0.5)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
      - conInspPhotos:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            Visible: =locAfficherPanneauPhotos
            Fill: =RGBA(255, 255, 255, 1)
            X: =103
            Y: =40
            Width: =1160
            Height: =690
          Children:
            - lblPhotoTitre:
                Control: Label@2.5.1
                Properties:
                  Text: ="Photos — " & LookUp(colQuestions, QuestionCode = locQuestionActive).Libelle
                  FontWeight: =FontWeight.Semibold
                  Size: =18
                  X: =24
                  Y: =12
                  Width: =820
                  Height: =44
            - lblPhotoCompteur:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    =With(
                        {
                            wQ: LookUp(colEtatComplet, QuestionCode = locQuestionActive),
                            wN: CountRows(Filter(colPhotos, QuestionCode = locQuestionActive))
                        },
                        With(
                            {wMin: If(wQ.TypeQuestion = "PHOTO" && wQ.ObligatoireEff, Max(1, wQ.PhotosMin), wQ.PhotosMin)},
                            wN & " photo(s)" & If(wMin > 0, "  ·  minimum " & wMin & If(wN >= wMin, " ✅", ""), "") & "  ·  maximum " & wQ.NbPhotosMax
                        )
                    )
                  Align: =Align.Right
                  X: =850
                  Y: =12
                  Width: =286
                  Height: =44
            - camInspPhoto:
                Control: Camera
                Properties:
                  Camera: =locCamera
                  X: =24
                  Y: =64
                  Width: =720
                  Height: =540
                  OnSelect: |-
                    =If(
                        CountRows(Filter(colPhotos, QuestionCode = locQuestionActive)) >= LookUp(colQuestions, QuestionCode = locQuestionActive).NbPhotosMax,
                        Notify("Nombre maximal de photos atteint pour cette question.", NotificationType.Warning),
                        With(
                            {wNow: Now(), wSrc: Substitute(JSON(Self.Photo, JSONFormat.IncludeBinaryData), Char(34), "")},
                            Collect(
                                colPhotos,
                                {
                                    PhotoLocaleID: Text(GUID()),
                                    QuestionCode: locQuestionActive,
                                    Source: wSrc,
                                    NomFichier: locQuestionActive & "_" & Text(wNow, "yyyymmdd_hhmmss") & "_" & Left(Text(GUID()), 4)
                                        & If(StartsWith(wSrc, "data:image/png"), ".png", ".jpg"),
                                    DatePhoto: wNow,
                                    EtatSynchro: "EN_ATTENTE"
                                }
                            )
                        );
                        IfError(SaveData(colPhotos, "luwa_photos"); true, false);
                        Notify("Photo " & CountRows(Filter(colPhotos, QuestionCode = locQuestionActive)) & " ajoutée.", NotificationType.Success, 1500);
                        // Question de type PHOTO : réponse PHOTO_CAPTURED dès la première photo (DEC-10)
                        With(
                            {wEx: LookUp(colReponses, QuestionCode = locQuestionActive)},
                            If(
                                LookUp(colQuestions, QuestionCode = locQuestionActive).TypeQuestion = "PHOTO",
                                If(
                                    IsBlank(wEx),
                                    Collect(colReponses, {ReponseID: Text(GUID()), QuestionCode: locQuestionActive, Valeur: "PHOTO_CAPTURED", ValeurNumerique: Blank(), Commentaire: Blank(), SharePointID: Blank(), EtatSynchro: "NOUVELLE"}),
                                    IsBlank(wEx.Valeur),
                                    Patch(colReponses, wEx, {Valeur: "PHOTO_CAPTURED", EtatSynchro: If(wEx.EtatSynchro = "NOUVELLE", "NOUVELLE", "MODIFIEE")})
                                )
                            )
                        );
                        Set(gblVersionReponses, gblVersionReponses + 1)
                    )
            - lblPhotoAide:
                Control: Label@2.5.1
                Properties:
                  Text: ="Touchez l'image pour prendre la photo."
                  Italic: =true
                  X: =24
                  Y: =612
                  Width: =500
                  Height: =36
            - btnPhotoCamera:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="🔄  Changer de caméra"
                  X: =544
                  Y: =612
                  Width: =200
                  Height: =48
                  OnSelect: |-
                    =UpdateContext({locCamera: If(locCamera = 0, 1, 0)})
            - galPhotosQuestion:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Items: =Filter(colPhotos, QuestionCode = locQuestionActive)
                  X: =768
                  Y: =64
                  Width: =368
                  Height: =540
                  TemplateSize: =150
                Children:
                  - imgPhotoMiniature:
                      Control: Image@2.2.3
                      Properties:
                        Image: =ThisItem.Source
                        X: =4
                        Y: =4
                        Width: =220
                        Height: =140
                  - lblPhotoEtat:
                      Control: Label@2.5.1
                      Properties:
                        Text: =If(ThisItem.EtatSynchro = "ENVOYEE", "Envoyée", "À envoyer")
                        Size: =11
                        X: =232
                        Y: =8
                        Width: =120
                        Height: =28
                  - icoPhotoSupprimer:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Visible: =ThisItem.EtatSynchro = "EN_ATTENTE"
                        Icon: =Icon.Trash
                        Color: =RGBA(196, 43, 28, 1)
                        X: =240
                        Y: =60
                        Width: =40
                        Height: =40
                        OnSelect: |-
                          =Remove(colPhotos, ThisItem);
                          IfError(SaveData(colPhotos, "luwa_photos"); true, false);
                          Set(gblVersionReponses, gblVersionReponses + 1)
            - btnPhotoFermer:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="Terminé (" & CountRows(Filter(colPhotos, QuestionCode = locQuestionActive)) & " photo(s))"
                  X: =886
                  Y: =620
                  Width: =250
                  Height: =52
                  DisplayMode: |-
                    =If(
                        locEnvoiPhotosEnCours || CountRows(Filter(colPhotos, QuestionCode = locQuestionActive)) < With({wQ: LookUp(colEtatComplet, QuestionCode = locQuestionActive)}, If(wQ.TypeQuestion = "PHOTO" && wQ.ObligatoireEff, Max(1, wQ.PhotosMin), wQ.PhotosMin)),
                        DisplayMode.Disabled,
                        DisplayMode.Edit
                    )
                  OnSelect: |-
                    =UpdateContext({locEnvoiPhotosEnCours: true});
                    // Envoi immédiat des photos prises (réparti au fil de l'inspection) ; hors connexion, elles restent « À envoyer »
                    If(
                        Connection.Connected && !IsEmpty(Filter(colPhotos, EtatSynchro = "EN_ATTENTE")),
                        ClearCollect(colPhotosAEnvoyer, Filter(colPhotos, EtatSynchro = "EN_ATTENTE"));
                        ForAll(
                            colPhotosAEnvoyer As wP,
                            IfError(
                                LUWA_EnvoyerPhoto.Run(
                                    gblInspectionGUID,
                                    wP.QuestionCode,
                                    gblNomOuvrage,
                                    wP.NomFichier,
                                    Text(DateAdd(wP.DatePhoto, TimeZoneOffset(wP.DatePhoto), TimeUnit.Minutes), "yyyy-mm-ddThh:mm:ssZ"),
                                    "COMPRESSEE",
                                    wP.Source,
                                    User().Email
                                );
                                Patch(colPhotos, LookUp(colPhotos, PhotoLocaleID = wP.PhotoLocaleID), {EtatSynchro: "ENVOYEE"});
                                true,
                                false
                            )
                        );
                        IfError(SaveData(colPhotos, "luwa_photos"); true, false)
                    );
                    UpdateContext({locEnvoiPhotosEnCours: false, locAfficherPanneauPhotos: false});
                    If(
                        !IsEmpty(Filter(colPhotos, EtatSynchro = "EN_ATTENTE")),
                        Notify("Photos conservées sur l'appareil : elles seront envoyées à l'enregistrement.", NotificationType.Information)
                    )
            - btnPhotoPlusTard:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="Plus tard"
                  Fill: =RGBA(255, 255, 255, 1)
                  Color: =RGBA(15, 108, 189, 1)
                  BorderColor: =RGBA(15, 108, 189, 1)
                  BorderThickness: =1
                  X: =768
                  Y: =620
                  Width: =110
                  Height: =52
                  OnSelect: |-
                    =// Ferme sans valider : les photos prises restent « À envoyer » ; le minimum reste à atteindre
                    UpdateContext({locAfficherPanneauPhotos: false})
