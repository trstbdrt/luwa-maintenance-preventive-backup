Screens:
  Screen_Home:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      OnVisible: |-
        =UpdateContext({locInspectionAAbandonner: Blank(), locOperationEnCours: false});
        // Protection hors connexion : inspection restée sur l'appareil sans être enregistrée dans SharePoint
        IfError(LoadData(colReponsesLocales, "luwa_reponses", true), false);
        IfError(LoadData(colContexteLocal, "luwa_contexte", true), false);
        IfError(LoadData(colPhotosLocales, "luwa_photos", true), false);
        // Copie de travail non envoyée (app fermée en cours d'inspection) : rangée automatiquement dans la file d'envoi
        If(
            (
                !IsEmpty(Filter(colReponsesLocales, EtatSynchro <> "SYNCHRONISEE"))
                    || !IsEmpty(Filter(colPhotosLocales, EtatSynchro = "EN_ATTENTE"))
            ) && !IsEmpty(colContexteLocal) && !IsBlank(First(colContexteLocal).InspectionGUID),
            With(
                {wC: First(colContexteLocal)},
                IfError(SaveData(colReponsesLocales, "luwa_rep_" & wC.InspectionGUID); true, false);
                IfError(SaveData(colPhotosLocales, "luwa_pho_" & wC.InspectionGUID); true, false);
                RemoveIf(colFile, InspectionGUID = wC.InspectionGUID);
                Collect(
                    colFile,
                    {
                        InspectionGUID: wC.InspectionGUID,
                        InspectionID: wC.InspectionID,
                        NomOuvrage: wC.NomOuvrage,
                        TypeInspection: wC.TypeInspection,
                        Soumise: false,
                        Etat: "BROUILLON",
                        DateCreation: Now(),
                        DateAjout: Now(),
                        DateSoumission: Blank(),
                        DateEnvoi: Blank(),
                        RapportHTML: "",
                        RapportCSV: "",
                        NbReponses: CountRows(Filter(colReponsesLocales, EtatSynchro <> "SYNCHRONISEE")),
                        NbPhotos: CountRows(Filter(colPhotosLocales, EtatSynchro = "EN_ATTENTE")),
                        PhotosEnvoyees: 0,
                        Essais: 0,
                        Message: ""
                    }
                );
                IfError(SaveData(colFile, "luwa_file"); true, false)
            );
            Clear(colReponsesLocales);
            Clear(colPhotosLocales);
            IfError(SaveData(colReponsesLocales, "luwa_reponses"); true, false);
            IfError(SaveData(colPhotosLocales, "luwa_photos"); true, false)
        );
        UpdateContext({locRecupDisponible: false});
        // Mes inspections en cours : chargées à l'affichage (la section n'apparaît que s'il y en a)
        If(
            Connection.Connected,
            // 1. SharePoint (délégué, colonne indexée) : inspections en brouillon ou en cours, tous utilisateurs (max. 2000)
            ClearCollect(colEnCoursTous, Filter(INSPECTIONS, StatutInspection.Value = "BROUILLON" || StatutInspection.Value = "EN_COURS"));
            // 2. Application : celles de l'utilisateur connecté (comparaison insensible à la casse)
            ClearCollect(
                colInspectionsAReprendre,
                Sort(Filter(colEnCoursTous, Lower(Inspecteur.Email) = Lower(User().Email)), DateDerniereModification, SortOrder.Descending)
            )
        );
        // Envoi de la file dès l'arrivée sur l'accueil
        Select(btnHomeEnvoyer)
    Children:
      - lblHomeTitre:
          Control: Label@2.5.1
          Properties:
            Text: ="Inspections préventives"
            X: =40
            Y: =24
            Width: =900
            Height: =56
            Size: =26
            FontWeight: =FontWeight.Semibold
      - lblHomeUtilisateur:
          Control: Label@2.5.1
          Properties:
            Text: =gblUtilisateur.NomAffiche
            Color: =RGBA(96, 94, 92, 1)
            Align: =Align.Right
            X: =600
            Y: =24
            Width: =480
            Height: =56
      - btnHomeFile:
          Control: Classic/Button@2.2.0
          Properties:
            Text: |-
              =With(
                  {n: CountRows(Filter(colFile, Etat <> "ENVOYEE"))},
                  If(n = 0, "✓  Tout est envoyé", "⇅  " & n & " à envoyer")
              )
            Size: =13
            FontWeight: =FontWeight.Semibold
            Fill: =If(CountRows(Filter(colFile, Etat <> "ENVOYEE")) = 0, RGBA(240, 242, 245, 1), RGBA(255, 244, 222, 1))
            Color: =If(CountRows(Filter(colFile, Etat <> "ENVOYEE")) = 0, RGBA(96, 94, 92, 1), RGBA(176, 96, 0, 1))
            HoverFill: =RGBA(230, 241, 251, 1)
            HoverColor: =RGBA(15, 108, 189, 1)
            BorderColor: =If(CountRows(Filter(colFile, Etat <> "ENVOYEE")) = 0, RGBA(200, 205, 212, 1), RGBA(202, 80, 16, 1))
            BorderThickness: =1
            RadiusTopLeft: =20
            RadiusTopRight: =20
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            X: =1096
            Y: =30
            Width: =230
            Height: =44
            OnSelect: =Navigate(Screen_Envois, ScreenTransition.None)
      - lblHomeHorsLigne:
          Control: Label@2.5.1
          Properties:
            Visible: =!Connection.Connected
            Text: |-
              ="⚠ Hors connexion : une inspection ne peut être commencée ou reprise qu'avec du réseau."
            Color: =RGBA(176, 96, 0, 1)
            Fill: =RGBA(255, 244, 222, 1)
            PaddingLeft: =12
