            Size: =24
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            X: =698
            Y: =btnHomePoteau.Y
            Width: =628
            Height: =160
            DisplayMode: =If(CountRows(Filter(colFile, Etat <> "ENVOYEE")) >= 20, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
