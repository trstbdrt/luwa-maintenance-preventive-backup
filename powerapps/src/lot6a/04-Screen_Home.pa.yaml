              Set(gblNomOuvrage, "");
              Set(gblInspectionGUID, "");
              Set(gblInspectionID, "");
              Set(gblInspection, Blank());
              Clear(colHistoriqueOuvrage);
              Navigate(Screen_Identification, ScreenTransition.None)
      - lblHomeRepriseTitre:
          Control: Label@2.5.1
          Properties:
            Visible: =!IsEmpty(Filter(colInspectionsAReprendre, !(InspectionGUID in Filter(colFile, Soumise).InspectionGUID)))
            Text: |-
              ="Reprendre une de mes inspections en cours (" & CountRows(Filter(colInspectionsAReprendre, !(InspectionGUID in Filter(colFile, Soumise).InspectionGUID))) & ")"
            Size: =16
            FontWeight: =FontWeight.Semibold
            X: =40
            Y: =btnHomePoteau.Y + btnHomePoteau.Height + 30
            Width: =1286
            Height: =40
      - galHomeReprise:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: =Filter(colInspectionsAReprendre, !(InspectionGUID in Filter(colFile, Soumise).InspectionGUID))
            Visible: =!IsEmpty(Filter(colInspectionsAReprendre, !(InspectionGUID in Filter(colFile, Soumise).InspectionGUID)))
            X: =40
            Y: =lblHomeRepriseTitre.Y + 44
            Width: =1286
            Height: =Min(3, CountRows(Filter(colInspectionsAReprendre, !(InspectionGUID in Filter(colFile, Soumise).InspectionGUID)))) * 80
            TemplateSize: =80
            TemplatePadding: =0
            OnSelect: |-
              =If(
                  !IsBlank(LookUp(colFile, InspectionGUID = ThisItem.InspectionGUID)),
                  // Brouillon gardé sur la tablette : ses données locales deviennent la copie de travail (et quittent la file)
                  Set(gblInspectionGUID, LookUp(colFile, InspectionGUID = ThisItem.InspectionGUID).InspectionGUID);
                  Set(gblInspectionID, LookUp(colFile, InspectionGUID = ThisItem.InspectionGUID).InspectionID);
                  Set(gblTypeInspection, LookUp(colFile, InspectionGUID = ThisItem.InspectionGUID).TypeInspection);
                  Set(gblNomOuvrage, LookUp(colFile, InspectionGUID = ThisItem.InspectionGUID).NomOuvrage);
                  Set(gblInspection, IfError(LookUp(INSPECTIONS, InspectionGUID = LookUp(colFile, InspectionGUID = ThisItem.InspectionGUID).InspectionGUID), Blank()));
                  ClearCollect(colReponsesLocales, Filter(colReponses, false));
                  IfError(LoadData(colReponsesLocales, "luwa_rep_" & LookUp(colFile, InspectionGUID = ThisItem.InspectionGUID).InspectionGUID, true); true, false);
                  ClearCollect(colPhotosLocales, Filter(colPhotos, false));
                  IfError(LoadData(colPhotosLocales, "luwa_pho_" & LookUp(colFile, InspectionGUID = ThisItem.InspectionGUID).InspectionGUID, true); true, false);
                  RemoveIf(colFile, InspectionGUID = gblInspectionGUID);
                  IfError(SaveData(colFile, "luwa_file"); true, false);
                  Set(gblRepriseLocale, true);
                  Navigate(Screen_Inspection, ScreenTransition.None),
                  !Connection.Connected,
                  Notify("Hors connexion : la reprise d'une inspection nécessite le réseau.", NotificationType.Warning),
                  Set(gblInspection, ThisItem);
                  Set(gblInspectionGUID, ThisItem.InspectionGUID);
                  Set(gblInspectionID, ThisItem.InspectionID);
                  Set(gblTypeInspection, ThisItem.TypeInspection.Value);
                  Set(gblNomOuvrage, ThisItem.NomOuvrage);
                  Set(gblRepriseLocale, false);
                  Navigate(Screen_Inspection, ScreenTransition.None)
              )
          Children:
            - btnRepriseCarte:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  X: =0
                  Y: =4
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight - 8
                  Fill: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(230, 241, 251, 1)
                  PressedFill: =RGBA(205, 226, 247, 1)
                  BorderColor: =RGBA(200, 205, 212, 1)
                  HoverBorderColor: =RGBA(15, 108, 189, 1)
                  PressedBorderColor: =RGBA(15, 108, 189, 1)
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Select(Parent)
            - lblRepriseLigne1:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.NomOuvrage
                  Size: =16
                  FontWeight: =FontWeight.Semibold
                  X: =20
                  Y: =10
                  Width: =Parent.TemplateWidth - 420
                  Height: =32
            - lblRepriseLigne2:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
