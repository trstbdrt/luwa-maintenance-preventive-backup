Screens:
  Screen_Resume:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      OnVisible: |-
        =// Contrôles de soumission (TD § 5.6) sur l'état calculé par le moteur de règles
        ClearCollect(
            colAnomalies,
            ForAll(
                Filter(
                    colEtatComplet As wE,
                    wE.ObligatoireEff && wE.TypeQuestion <> "PHOTO"
                        && With({wR: LookUp(colReponses, QuestionCode = wE.QuestionCode)}, IsBlank(wR.Valeur) && IsBlank(wR.ValeurNumerique))
                ) As wE,
                {Ordre: wE.OrdreAffichage, TypeAnomalie: "Question obligatoire", QuestionCode: wE.QuestionCode, Libelle: wE.Libelle, Detail: "Réponse manquante"}
            )
        );
        Collect(
            colAnomalies,
            ForAll(
                Filter(
                    colEtatComplet As wE,
                    wE.Visible
                        && CountRows(Filter(colPhotos, QuestionCode = wE.QuestionCode))
                            < If(wE.TypeQuestion = "PHOTO" && wE.ObligatoireEff, Max(1, wE.PhotosMin), wE.PhotosMin)
                ) As wE,
                {
                    Ordre: wE.OrdreAffichage,
                    TypeAnomalie: "Photo manquante",
                    QuestionCode: wE.QuestionCode,
                    Libelle: wE.Libelle,
                    Detail: CountRows(Filter(colPhotos, QuestionCode = wE.QuestionCode)) & "/"
                        & If(wE.TypeQuestion = "PHOTO" && wE.ObligatoireEff, Max(1, wE.PhotosMin), wE.PhotosMin) & " photo(s)"
                }
            )
        );
        Collect(
            colAnomalies,
            ForAll(
                Filter(
                    colEtatComplet As wE,
                    wE.CommentaireObligatoireEff && IsBlank(LookUp(colReponses, QuestionCode = wE.QuestionCode).Commentaire)
                ) As wE,
                {Ordre: wE.OrdreAffichage, TypeAnomalie: "Commentaire obligatoire", QuestionCode: wE.QuestionCode, Libelle: wE.Libelle, Detail: "Commentaire manquant"}
            )
        );
        Collect(
            colAnomalies,
            ForAll(
                Filter(colReglesEval, Vraie && Action = "BLOQUER_SOUMISSION") As wR,
                {
                    Ordre: LookUp(colQuestions, QuestionCode = wR.QuestionSource).OrdreAffichage,
                    TypeAnomalie: "Blocage",
                    QuestionCode: wR.QuestionSource,
                    Libelle: LookUp(colQuestions, QuestionCode = wR.QuestionSource).Libelle,
                    Detail: wR.Commentaire
                }
            )
        );
        UpdateContext({locSoumissionEnCours: false})
    Children:
      - lblResTitre:
          Control: Label@2.5.1
          Properties:
            Text: ="Résumé — " & gblInspectionID & "  —  " & gblNomOuvrage
            X: =40
            Y: =16
            Width: =1000
            Height: =50
            Size: =22
            FontWeight: =FontWeight.Semibold
      - lblResSynthese:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =gblTypeInspection & "  ·  "
              & CountRows(Filter(colEtatComplet, Visible)) & " questions affichées  ·  "
              & CountRows(colPhotos) & " photo(s)  ·  "
              & If(IsEmpty(colAnomalies), "aucune anomalie", CountRows(colAnomalies) & " point(s) à compléter")
            X: =40
            Y: =66
            Width: =1000
            Height: =32
      - lblResOK:
          Control: Label@2.5.1
          Properties:
            Visible: =IsEmpty(colAnomalies)
            Text: ="✔ Le formulaire est complet. Vous pouvez soumettre l'inspection."
            Color: =RGBA(16, 124, 16, 1)
            Fill: =RGBA(223, 246, 221, 1)
            Size: =16
            X: =40
            Y: =120
            Width: =1286
            Height: =60
            PaddingLeft: =16
      - galResAnomalies:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Visible: =!IsEmpty(colAnomalies)
            Items: =Sort(colAnomalies, Ordre)
            X: =40
            Y: =110
            Width: =1286
            Height: =560
            TemplateSize: =70
            OnSelect: |-
              =Set(gblQuestionCible, ThisItem.QuestionCode);
              Navigate(Screen_Inspection, ScreenTransition.None)
          Children:
            - lblResAnoType:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.TypeAnomalie
                  Color: =If(ThisItem.TypeAnomalie = "Blocage", RGBA(196, 43, 28, 1), RGBA(176, 96, 0, 1))
                  FontWeight: =FontWeight.Semibold
                  X: =16
                  Y: =6
                  Width: =260
                  Height: =28
            - lblResAnoLibelle:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.Libelle
                  X: =16
                  Y: =34
                  Width: =Parent.TemplateWidth - 400
                  Height: =28
            - lblResAnoDetail:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.Detail
                  Align: =Align.Right
                  X: =Parent.TemplateWidth - 380
                  Y: =20
                  Width: =300
                  Height: =28
            - icoResAnoOuvrir:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =Icon.ChevronRight
                  Color: =RGBA(15, 108, 189, 1)
                  X: =Parent.TemplateWidth - 56
                  Y: =19
                  Width: =32
                  Height: =32
            - btnResAnoCarte:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  X: =4
                  Y: =4
                  Width: =Parent.TemplateWidth - 8
                  Height: =Parent.TemplateHeight - 8
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(15, 108, 189, 0.08)
                  PressedFill: =RGBA(15, 108, 189, 0.18)
                  BorderColor: =RGBA(200, 205, 212, 1)
                  HoverBorderColor: =RGBA(15, 108, 189, 1)
                  PressedBorderColor: =RGBA(15, 108, 189, 1)
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Select(Parent)
      - btnResRetour:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Retour au formulaire"
            X: =40
            Y: =690
            Width: =280
            Height: =56
            OnSelect: |-
              =Set(gblQuestionCible, "");
              Navigate(Screen_Inspection, ScreenTransition.None)
      - btnResSoumettre:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Soumettre l'inspection"
            X: =1046
            Y: =690
            Width: =280
            Height: =56
            DisplayMode: =If(IsEmpty(colAnomalies) && !locSoumissionEnCours, DisplayMode.Edit, DisplayMode.Disabled)
            OnSelect: |-
              =If(
                  !Connection.Connected,
                  Notify("Hors connexion : la soumission nécessite le réseau.", NotificationType.Warning),
                  !IsEmpty(Filter(colReponses, EtatSynchro <> "SYNCHRONISEE")) || !IsEmpty(Filter(colPhotos, EtatSynchro = "EN_ATTENTE")),
                  Notify("Des éléments ne sont pas encore enregistrés : revenez au formulaire et enregistrez le brouillon.", NotificationType.Warning),
                  UpdateContext({locSoumissionEnCours: true});
                  IfError(
                      Patch(
                          INSPECTIONS,
                          LookUp(INSPECTIONS, InspectionGUID = gblInspectionGUID),
                          {StatutInspection: {Value: "TERMINE"}, DateSoumission: Now(), DateDerniereModification: Now()}
                      );
                      // Copie locale vidée : l'inspection est soumise (DEC-25)
                      Clear(colReponses);
                      Clear(colPhotos);
                      IfError(SaveData(colReponses, "luwa_reponses"), false);
                      IfError(SaveData(colPhotos, "luwa_photos"), false);
                      Set(gblQuestionCible, "");
                      Notify("Inspection " & gblInspectionID & " soumise.", NotificationType.Success);
                      Navigate(Screen_Home, ScreenTransition.None),
                      Notify("Soumission impossible : " & FirstError.Message, NotificationType.Error)
                  );
                  UpdateContext({locSoumissionEnCours: false})
              )
