Screens:
  Screen_Type:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
    Children:
      - lblTypeTitre:
          Control: Label@2.5.1
          Properties:
            Text: ="Type d'inspection"
            X: =40
            Y: =30
            Width: =800
            Height: =60
            Size: =24
            FontWeight: =FontWeight.Semibold
      - btnTypePoteau:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Poteau"
            X: =40
            Y: =140
            Width: =400
            Height: =120
            Size: =22
            OnSelect: |-
              =Set(gblTypeInspection, "POTEAU");
              Navigate(Screen_Identification, ScreenTransition.None)
      - lblTypePoteauInfo:
          Control: Label@2.5.1
          Properties:
            Text: ="Équipes au sol"
            X: =40
            Y: =270
            Width: =400
            Height: =40
      - btnTypeLuminaire:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Luminaire"
            X: =480
            Y: =140
            Width: =400
            Height: =120
            Size: =22
            OnSelect: |-
              =Set(gblTypeInspection, "LUMINAIRE");
              Navigate(Screen_Identification, ScreenTransition.None)
      - lblTypeLuminaireInfo:
          Control: Label@2.5.1
          Properties:
            Text: ="Équipes en nacelle"
            X: =480
            Y: =270
            Width: =400
            Height: =40
      - btnTypeRetour:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Retour"
            X: =40
            Y: =680
            Width: =200
            Height: =50
            OnSelect: =Navigate(Screen_Home, ScreenTransition.None)
