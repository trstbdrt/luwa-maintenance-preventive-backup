Screens:
  Screen_History:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      OnVisible: |-
        =UpdateContext({locDepuisAccueil: IsBlank(gblInspectionConsultee), locRechercheOuvrage: "", locHistRechercheFaite: false, locHistTexte: ""});
        Clear(colHistorique);
        If(
            IsBlank(gblInspectionConsultee),
            Clear(colReponsesConsultees);
            Clear(colPhotosConsultees),
            ClearCollect(colReponsesConsultees, Filter(REPONSES, InspectionGUID = gblInspectionConsultee.InspectionGUID));
            ClearCollect(colPhotosConsultees, Filter(PHOTOS_INSPECTIONS, InspectionGUID = gblInspectionConsultee.InspectionGUID))
        )
    Children:
      - lblHistTitre:
          Control: Label@2.5.1
          Properties:
            Text: ="Historique — tous les techniciens (lecture seule)"
            X: =40
            Y: =30
            Width: =800
            Height: =60
            Size: =24
            FontWeight: =FontWeight.Semibold
      - txtHistRecherche:
          Control: Classic/TextInput@2.3.2
          Properties:
            Visible: =locDepuisAccueil
            Default: =""
            HintText: ="Nom de l'ouvrage"
            X: =40
            Y: =100
            Width: =300
            Height: =50
      - btnHistRechercher:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =locDepuisAccueil
            Text: ="Rechercher"
            X: =350
            Y: =100
            Width: =130
            Height: =50
            DisplayMode: =If(IsBlank(Trim(txtHistRecherche.Text)), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =// DEC-29 : recherche par clé (majuscules, sans espaces)
              UpdateContext({locRechercheOuvrage: Substitute(Upper(txtHistRecherche.Text), " ", ""), locHistTexte: Upper(Trim(txtHistRecherche.Text))});
              ClearCollect(
                  colHistorique,
                  Sort(Filter(INSPECTIONS, CleOuvrage = locRechercheOuvrage), DateCreation, SortOrder.Descending)
              );
              UpdateContext({locHistRechercheFaite: true})
      - lblHistAucun:
          Control: Label@2.5.1
          Properties:
            Visible: =locDepuisAccueil && locHistRechercheFaite && IsEmpty(colHistorique)
            Text: ="Aucune inspection trouvée pour « " & locHistTexte & " »."
            Size: =13
            Italic: =true
            Color: =RGBA(120, 120, 120, 1)
            X: =40
            Y: =160
            Width: =440
            Height: =60
      - galHistResultats:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Visible: =locDepuisAccueil
            Items: =colHistorique
            X: =40
            Y: =160
            Width: =440
            Height: =500
            TemplateSize: =76
            OnSelect: |-
              =Set(gblInspectionConsultee, ThisItem);
              ClearCollect(colReponsesConsultees, Filter(REPONSES, InspectionGUID = ThisItem.InspectionGUID));
              ClearCollect(colPhotosConsultees, Filter(PHOTOS_INSPECTIONS, InspectionGUID = ThisItem.InspectionGUID))
          Children:
            - lblHistResLigne1:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: =Text(Coalesce(ThisItem.DateSoumission, ThisItem.DateCreation), "dd/mm/yyyy") & "  ·  " & If(ThisItem.TypeInspection.Value = "LUMINAIRE", "Luminaire", "Poteau")
                  X: =16
                  Y: =6
                  Width: =Parent.TemplateWidth - 64
                  Height: =32
                  FontWeight: =FontWeight.Semibold
            - lblHistResLigne2:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: =Switch(ThisItem.StatutInspection.Value, "TERMINE", "Terminée", "EN_COURS", "En cours", "BROUILLON", "Brouillon", "INACCESSIBLE", "Inaccessible", "ARCHIVE", "Archivée", "ABANDONNE", "Abandonnée", ThisItem.StatutInspection.Value) & "  ·  " & ThisItem.Inspecteur.DisplayName
                  X: =16
                  Y: =38
                  Width: =Parent.TemplateWidth - 64
                  Height: =30
                  Size: =12
            - icoHistResOuvrir:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =Icon.ChevronRight
                  Color: =RGBA(15, 108, 189, 1)
                  X: =Parent.TemplateWidth - 48
                  Y: =(Parent.TemplateHeight - 32) / 2
                  Width: =32
                  Height: =32
            - btnHistResCarte:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  X: =4
                  Y: =4
                  Width: =Parent.TemplateWidth - 8
                  Height: =Parent.TemplateHeight - 8
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(15, 108, 189, 0.08)
                  PressedFill: =RGBA(15, 108, 189, 0.18)
                  BorderColor: =RGBA(200, 205, 212, 1)
                  HoverBorderColor: =RGBA(15, 108, 189, 1)
                  PressedBorderColor: =RGBA(15, 108, 189, 1)
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Select(Parent)
      - lblHistDetail:
          Control: Label@2.5.1
          Properties:
            Visible: =!IsBlank(gblInspectionConsultee)
            Text: |-
              =gblInspectionConsultee.NomOuvrage
              & "  ·  " & If(gblInspectionConsultee.TypeInspection.Value = "LUMINAIRE", "Luminaire", "Poteau")
              & "  ·  " & Switch(gblInspectionConsultee.StatutInspection.Value, "TERMINE", "Terminée", "EN_COURS", "En cours", "BROUILLON", "Brouillon", "INACCESSIBLE", "Inaccessible", "ARCHIVE", "Archivée", "ABANDONNE", "Abandonnée", gblInspectionConsultee.StatutInspection.Value)
              & Char(10) & "Inspecteur : " & gblInspectionConsultee.Inspecteur.DisplayName
              & "  ·  créée le " & Text(gblInspectionConsultee.DateCreation, "dd/mm/yyyy hh:mm")
              & If(
                  IsBlank(gblInspectionConsultee.DateSoumission),
                  "",
                  "  ·  soumise le " & Text(gblInspectionConsultee.DateSoumission, "dd/mm/yyyy hh:mm")
              )
            X: =500
            Y: =100
            Width: =830
            Height: =80
            FontWeight: =FontWeight.Semibold
      - galHistReponses:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Visible: =!IsBlank(gblInspectionConsultee)
            Items: |-
              =Sort(
                  AddColumns(
                      colReponsesConsultees,
                      Ordre, LookUp(colQuestions, QuestionCode = ThisRecord.QuestionCode).OrdreAffichage,
                      LibelleQuestion, LookUp(colQuestions, QuestionCode = ThisRecord.QuestionCode).Libelle
                  ),
                  Ordre
              )
            X: =500
            Y: =190
            Width: =830
            Height: =340
            TemplateSize: =84
          Children:
            - lblHistRepQuestion:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.LibelleQuestion
                  X: =16
                  Y: =4
                  Width: =Parent.TemplateWidth - 32
                  Height: =28
                  FontWeight: =FontWeight.Semibold
            - lblHistRepValeur:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    ="Réponse : " & With({wQ: LookUp(colQuestions, QuestionCode = ThisItem.QuestionCode)}, If(!IsBlank(ThisItem.ValeurNumerique), Text(Round(ThisItem.ValeurNumerique, 1)), ThisItem.Valeur = "PHOTO_CAPTURED", "photos", IsBlank(ThisItem.Valeur), "—", With({wCodes: Split(wQ.ValeursPossibles, "|"), wLibs: Split(Coalesce(wQ.LibellesValeurs, wQ.ValeursPossibles), "|"), wV: ThisItem.Valeur}, With({wPos: First(Filter(Sequence(CountRows(wCodes)), Index(wCodes, Value).Value = wV)).Value}, If(IsBlank(wPos), wV, Index(wLibs, wPos).Value)))))
                  X: =16
                  Y: =32
                  Width: =Parent.TemplateWidth - 32
                  Height: =24
                  Size: =12
            - lblHistRepCommentaire:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    =If(IsBlank(ThisItem.Commentaire), "", "Commentaire : " & ThisItem.Commentaire)
                  X: =16
                  Y: =56
                  Width: =Parent.TemplateWidth - 32
                  Height: =24
                  Size: =12
                  Italic: =true
      - galHistPhotos:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Horizontal_TwoTextOneImageVariant_ver5.0
          Properties:
            Visible: =!IsBlank(gblInspectionConsultee)
            Items: =Filter(PHOTOS_INSPECTIONS, InspectionGUID = gblInspectionConsultee.InspectionGUID)
            X: =500
            Y: =540
            Width: =830
            Height: =130
            TemplateSize: =140
          Children:
            - imgHistPhoto:
                Control: Image@2.2.3
                Properties:
                  Image: =ThisItem.'{Thumbnail}'.Large
                  X: =4
                  Y: =4
                  Width: =130
                  Height: =96
            - lblHistPhotoQuestion:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.QuestionCode
                  X: =4
                  Y: =100
                  Width: =130
                  Height: =24
                  Size: =10
      - btnHistRetour:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Retour"
            X: =40
            Y: =680
            Width: =200
            Height: =50
            OnSelect: |-
              =Set(gblInspectionConsultee, Blank());
              Navigate(gblEcranRetourHistorique, ScreenTransition.None)
