Screens:
  Screen_Home:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      OnVisible: |-
        =UpdateContext({locInspectionAAbandonner: Blank(), locOperationEnCours: false});
        // Protection hors connexion : inspection restée sur l'appareil sans être enregistrée dans SharePoint
        IfError(LoadData(colReponsesLocales, "luwa_reponses", true), false);
        IfError(LoadData(colContexteLocal, "luwa_contexte", true), false);
        IfError(LoadData(colPhotosLocales, "luwa_photos", true), false);
        UpdateContext({
            locRecupDisponible: (
                !IsEmpty(Filter(colReponsesLocales, EtatSynchro <> "SYNCHRONISEE"))
                    || !IsEmpty(Filter(colPhotosLocales, EtatSynchro = "EN_ATTENTE"))
            ) && !IsEmpty(colContexteLocal)
        });
        // Mes inspections en cours : chargées à l'affichage (la section n'apparaît que s'il y en a)
        If(
            Connection.Connected,
            // 1. SharePoint (délégué, colonne indexée) : inspections en brouillon ou en cours, tous utilisateurs (max. 2000)
            ClearCollect(colEnCoursTous, Filter(INSPECTIONS, StatutInspection.Value = "BROUILLON" || StatutInspection.Value = "EN_COURS"));
            // 2. Application : celles de l'utilisateur connecté (comparaison insensible à la casse)
            ClearCollect(
                colInspectionsAReprendre,
                Sort(Filter(colEnCoursTous, Lower(Inspecteur.Email) = Lower(User().Email)), DateDerniereModification, SortOrder.Descending)
            )
        )
    Children:
      - lblHomeTitre:
          Control: Label@2.5.1
          Properties:
            Text: ="Inspections préventives"
            X: =40
            Y: =24
            Width: =900
            Height: =56
            Size: =26
            FontWeight: =FontWeight.Semibold
      - lblHomeUtilisateur:
          Control: Label@2.5.1
          Properties:
            Text: =gblUtilisateur.NomAffiche
            Color: =RGBA(96, 94, 92, 1)
            Align: =Align.Right
            X: =940
            Y: =24
            Width: =386
            Height: =56
      - lblHomeHorsLigne:
          Control: Label@2.5.1
          Properties:
            Visible: =!Connection.Connected
            Text: |-
              ="⚠ Hors connexion : une inspection ne peut être commencée ou reprise qu'avec du réseau."
            Color: =RGBA(176, 96, 0, 1)
            Fill: =RGBA(255, 244, 222, 1)
            PaddingLeft: =12
            X: =40
            Y: =84
            Width: =1286
            Height: =36
      - lblHomeRecup:
          Control: Label@2.5.1
          Properties:
            Visible: =locRecupDisponible
            Text: |-
              ="⚠ L'inspection " & First(colContexteLocal).NomOuvrage & " a "
              & CountRows(Filter(colReponsesLocales, EtatSynchro <> "SYNCHRONISEE")) & " réponse(s) et "
              & CountRows(Filter(colPhotosLocales, EtatSynchro = "EN_ATTENTE"))
              & " photo(s) non enregistrée(s), gardées sur cette tablette."
            Color: =RGBA(176, 96, 0, 1)
            Fill: =RGBA(255, 244, 222, 1)
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =12
            X: =40
            Y: =128
            Width: =1000
            Height: =64
      - btnHomeRecup:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =locRecupDisponible
            Text: ="Récupérer et enregistrer"
            Fill: =RGBA(202, 80, 16, 1)
            HoverFill: =RGBA(170, 66, 12, 1)
            X: =1056
            Y: =128
            Width: =270
            Height: =64
            OnSelect: |-
              =With(
                  {wC: First(colContexteLocal)},
                  Set(gblInspectionGUID, wC.InspectionGUID);
                  Set(gblInspectionID, wC.InspectionID);
                  Set(gblTypeInspection, wC.TypeInspection);
                  Set(gblNomOuvrage, wC.NomOuvrage)
              );
              Set(gblRepriseLocale, true);
              Navigate(Screen_Inspection, ScreenTransition.None)
      - btnHomePoteau:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Inspecter un poteau"
            Size: =24
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            X: =40
            Y: =If(locRecupDisponible, 214, 150)
            Width: =628
            Height: =160
            DisplayMode: =If(locRecupDisponible, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =Set(gblTypeInspection, "POTEAU");
              Set(gblNomOuvrage, "");
              Set(gblInspectionGUID, "");
              Set(gblInspectionID, "");
              Set(gblInspection, Blank());
              Clear(colHistoriqueOuvrage);
              Navigate(Screen_Identification, ScreenTransition.None)
      - btnHomeLuminaire:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Inspecter un luminaire"
            Size: =24
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            X: =698
            Y: =btnHomePoteau.Y
            Width: =628
            Height: =160
            DisplayMode: =If(locRecupDisponible, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =Set(gblTypeInspection, "LUMINAIRE");
              Set(gblNomOuvrage, "");
              Set(gblInspectionGUID, "");
              Set(gblInspectionID, "");
              Set(gblInspection, Blank());
              Clear(colHistoriqueOuvrage);
              Navigate(Screen_Identification, ScreenTransition.None)
      - lblHomeRepriseTitre:
          Control: Label@2.5.1
          Properties:
            Visible: =!IsEmpty(colInspectionsAReprendre)
            Text: ="Reprendre une de mes inspections en cours (" & CountRows(colInspectionsAReprendre) & ")"
            Size: =16
            FontWeight: =FontWeight.Semibold
            X: =40
            Y: =btnHomePoteau.Y + btnHomePoteau.Height + 30
            Width: =1286
            Height: =40
      - galHomeReprise:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: =colInspectionsAReprendre
            Visible: =!IsEmpty(colInspectionsAReprendre)
            X: =40
            Y: =lblHomeRepriseTitre.Y + 44
            Width: =1286
            Height: =Min(3, CountRows(colInspectionsAReprendre)) * 80
            TemplateSize: =80
            TemplatePadding: =0
            OnSelect: |-
              =If(
                  locRecupDisponible && First(colContexteLocal).InspectionGUID <> ThisItem.InspectionGUID,
                  Notify("Enregistrez d'abord l'inspection " & First(colContexteLocal).NomOuvrage & " restée sur la tablette.", NotificationType.Warning),
                  !Connection.Connected && !(locRecupDisponible && First(colContexteLocal).InspectionGUID = ThisItem.InspectionGUID),
                  Notify("Hors connexion : la reprise d'une inspection nécessite le réseau.", NotificationType.Warning),
                  Set(gblInspection, ThisItem);
                  Set(gblInspectionGUID, ThisItem.InspectionGUID);
                  Set(gblInspectionID, ThisItem.InspectionID);
                  Set(gblTypeInspection, ThisItem.TypeInspection.Value);
                  Set(gblNomOuvrage, ThisItem.NomOuvrage);
                  // Si cette inspection a des réponses non enregistrées sur l'appareil, on repart de la copie locale
                  Set(gblRepriseLocale, locRecupDisponible && First(colContexteLocal).InspectionGUID = ThisItem.InspectionGUID);
                  Navigate(Screen_Inspection, ScreenTransition.None)
              )
          Children:
            - btnRepriseCarte:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  X: =0
                  Y: =4
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight - 8
                  Fill: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(230, 241, 251, 1)
                  PressedFill: =RGBA(205, 226, 247, 1)
                  BorderColor: =RGBA(200, 205, 212, 1)
                  HoverBorderColor: =RGBA(15, 108, 189, 1)
                  PressedBorderColor: =RGBA(15, 108, 189, 1)
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Select(Parent)
            - lblRepriseLigne1:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.NomOuvrage
                  Size: =16
                  FontWeight: =FontWeight.Semibold
                  X: =20
                  Y: =10
                  Width: =Parent.TemplateWidth - 420
                  Height: =32
            - lblRepriseLigne2:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: |-
                    =If(ThisItem.TypeInspection.Value = "LUMINAIRE", "Luminaire", "Poteau")
                    & "  ·  modifiée le " & Text(ThisItem.DateDerniereModification, "dd/mm/yyyy à hh:mm")
                  Size: =12
                  Color: =RGBA(96, 94, 92, 1)
                  X: =20
                  Y: =42
                  Width: =Parent.TemplateWidth - 420
                  Height: =28
            - btnRepriseOuvrir:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="Reprendre  ›"
                  Size: =14
                  Fill: =RGBA(230, 241, 251, 1)
                  Color: =RGBA(15, 108, 189, 1)
                  HoverFill: =RGBA(205, 226, 247, 1)
                  HoverColor: =RGBA(15, 108, 189, 1)
                  BorderColor: =RGBA(15, 108, 189, 1)
                  BorderThickness: =1
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  X: =Parent.TemplateWidth - 380
                  Y: =18
                  Width: =200
                  Height: =44
                  OnSelect: =Select(Parent)
            - btnRepriseAbandonner:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="Abandonner"
                  Size: =12
                  Underline: =true
                  Fill: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(120, 120, 120, 1)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(196, 43, 28, 1)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  X: =Parent.TemplateWidth - 160
                  Y: =18
                  Width: =140
                  Height: =44
                  OnSelect: |-
                    =UpdateContext({locInspectionAAbandonner: ThisItem})
      - btnHomeHistorique:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Consulter l'historique  ›"
            Size: =14
            Underline: =true
            Align: =Align.Right
            Fill: =RGBA(0, 0, 0, 0)
            Color: =RGBA(15, 108, 189, 1)
            HoverFill: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(12, 90, 160, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            X: =1026
            Y: =700
            Width: =300
            Height: =44
            OnSelect: |-
              =Set(gblInspectionConsultee, Blank());
              Set(gblEcranRetourHistorique, Screen_Home);
              Navigate(Screen_History, ScreenTransition.None)
      - rectHomeVoile:
          Control: Rectangle@2.3.0
          Properties:
            Visible: =!IsBlank(locInspectionAAbandonner)
            Fill: =RGBA(0, 0, 0, 0.4)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
      - conHomeAbandon:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            Visible: =!IsBlank(locInspectionAAbandonner)
            Fill: =RGBA(255, 255, 255, 1)
            X: =383
            Y: =234
            Width: =600
            Height: =300
          Children:
            - lblAbandonTexte:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    ="Abandonner l'inspection " & locInspectionAAbandonner.NomOuvrage
                    & " (" & If(locInspectionAAbandonner.TypeInspection.Value = "LUMINAIRE", "luminaire", "poteau") & ") ?"
                    & Char(10) & "Elle ne sera ni supprimée ni modifiable : elle disparaît de la reprise"
                    & " et ne déclenche plus l'avertissement de concurrence."
                  X: =30
                  Y: =20
                  Width: =540
                  Height: =160
            - btnAbandonConfirmer:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="Confirmer l'abandon"
                  X: =30
                  Y: =210
                  Width: =260
                  Height: =60
                  DisplayMode: =If(locOperationEnCours, DisplayMode.Disabled, DisplayMode.Edit)
                  OnSelect: |-
                    =UpdateContext({locOperationEnCours: true});
                    IfError(
                        Patch(
                            INSPECTIONS,
                            LookUp(INSPECTIONS, InspectionGUID = locInspectionAAbandonner.InspectionGUID),
                            {StatutInspection: {Value: "ABANDONNE"}, DateDerniereModification: Now()}
                        );
                        Notify("Inspection abandonnée.", NotificationType.Success),
                        Notify("Abandon impossible : " & FirstError.Message, NotificationType.Error)
                    );
                    // 1. SharePoint (délégué, colonne indexée) : inspections en brouillon ou en cours, tous utilisateurs (max. 2000)
                    ClearCollect(colEnCoursTous, Filter(INSPECTIONS, StatutInspection.Value = "BROUILLON" || StatutInspection.Value = "EN_COURS"));
                    // 2. Application : celles de l'utilisateur connecté (comparaison insensible à la casse)
                    ClearCollect(
                        colInspectionsAReprendre,
                        Sort(Filter(colEnCoursTous, Lower(Inspecteur.Email) = Lower(User().Email)), DateDerniereModification, SortOrder.Descending)
                    );
                    UpdateContext({locInspectionAAbandonner: Blank(), locOperationEnCours: false})
            - btnAbandonAnnuler:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="Annuler"
                  X: =320
                  Y: =210
                  Width: =200
                  Height: =60
                  OnSelect: |-
                    =UpdateContext({locInspectionAAbandonner: Blank()})
